
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tell Them Studio</title>
    <meta name="description" content="A trend-setting social creation studio for building custom radio stations, multi-singer band tracks (up to 3:50), scheduled 5–10 minute mini-podcasts, genuine craft commercials, and seasonal holiday hits ready to publish to Spotify, YouTube, and Amazon Music.">
    <meta property="og:title" content="Tell Them Studio">
    <meta property="og:description" content="A trend-setting social creation studio for building custom radio stations, multi-singer band tracks (up to 3:50), scheduled 5–10 minute mini-podcasts, genuine craft commercials, and seasonal holiday hits ready to publish to Spotify, YouTube, and Amazon Music.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #fbfbfd;
            color: #1d1d1f;
        }
        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
        }
        .apple-gradient {
            background: linear-gradient(135deg, #007aff 0%, #00c6ff 100%);
        }
        .creative-gradient {
            background: linear-gradient(135deg, #ff3b30 0%, #ff9500 100%);
        }
        .music-gradient {
            background: linear-gradient(135deg, #af52de 0%, #ff2d55 100%);
        }
        .card-shadow {
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }
        .card-shadow:hover {
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
